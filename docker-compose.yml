services:
  app:
    build: .
    container_name: payroll_app
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://payuser:paypass@db:5432/payrolldb
      - SECRET_KEY=supersecretkey123changethis
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16-alpine
    container_name: payroll_db
    environment:
      - POSTGRES_USER=payuser
      - POSTGRES_PASSWORD=paypass
      - POSTGRES_DB=payrolldb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payuser -d payrolldb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres_data: