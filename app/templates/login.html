<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payroll System — Login</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:sans-serif;background:#F8F9FA;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .card{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:2rem;width:100%;max-width:380px}
  h1{font-size:22px;font-weight:700;color:#0F2044;margin-bottom:4px}
  p{font-size:13px;color:#64748B;margin-bottom:1.5rem}
  label{font-size:12px;font-weight:600;color:#374151;display:block;margin-bottom:4px}
  input{width:100%;padding:9px 12px;border:1px solid #E2E8F0;border-radius:7px;font-size:14px;margin-bottom:1rem;outline:none}
  input:focus{border-color:#1A56A0}
  button{width:100%;padding:10px;background:#0F2044;color:#fff;border:none;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer}
  button:hover{background:#1A56A0}
  .err{color:#DC2626;font-size:13px;margin-top:8px;display:none}
</style>
</head>
<body>
<div class="card">
  <h1>Payroll System</h1>
  <p>Sign in to continue</p>
  <label>Username</label>
  <input type="text" id="username" placeholder="Enter username" />
  <label>Password</label>
  <input type="password" id="password" placeholder="Enter password" />
  <button onclick="login()">Sign In</button>
  <div class="err" id="err"></div>
</div>
<script>
async function login() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const err = document.getElementById('err');
  err.style.display = 'none';
  const res = await fetch('/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username, password})
  });
  const data = await res.json();
  if (res.ok) {
    window.location.href = '/employees';
  } else {
    err.textContent = data.error;
    err.style.display = 'block';
  }
}
document.addEventListener('keypress', e => { if(e.key==='Enter') login(); });
</script>
</body>
</html>
