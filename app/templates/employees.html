<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employees — Payroll System</title>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:sans-serif;background:#F8F9FA;color:#1A1A1A}
  .topbar{background:#0F2044;color:#fff;padding:10px 1rem;display:flex;justify-content:space-between;align-items:center}
  .topbar h1{font-size:16px;font-weight:700}
  .topbar span{font-size:13px;opacity:.7}
  .logout{color:#fff;text-decoration:none;font-size:13px;padding:5px 12px;border:1px solid rgba(255,255,255,.3);border-radius:6px}
  .main{max-width:900px;margin:1rem auto;padding:0 1rem}
  .toolbar{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
  input{padding:8px 12px;border:1px solid #E2E8F0;border-radius:7px;font-size:13px;flex:1;min-width:200px}
  select{padding:8px 12px;border:1px solid #E2E8F0;border-radius:7px;font-size:13px}
  .btn{padding:8px 14px;border:none;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer}
  .btn-blue{background:#1A56A0;color:#fff}
  .btn-green{background:#16A34A;color:#fff;padding:4px 10px;font-size:12px}
  .btn-yellow{background:#D97706;color:#fff;padding:4px 10px;font-size:12px}
  .btn-red{background:#DC2626;color:#fff;padding:4px 10px;font-size:12px}
  .card{background:#fff;border:1px solid #E2E8F0;border-radius:10px;padding:1rem}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{background:#0F2044;color:#fff;padding:9px 10px;text-align:left;font-size:12px}
  td{padding:9px 10px;border-bottom:1px solid #E2E8F0;vertical-align:middle}
  .badge{font-size:11px;padding:2px 8px;border-radius:9px;font-weight:600}
  .badge-active{background:#F0FDF4;color:#16A34A;border:1px solid #86EFAC}
  .badge-inactive{background:#FEF2F2;color:#DC2626;border:1px solid #FCA5A5}
  .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center}
  .modal.show{display:flex}
  .modal-box{background:#fff;border-radius:12px;padding:1.5rem;width:100%;max-width:440px;max-height:90vh;overflow-y:auto}
  .modal-box h2{font-size:17px;font-weight:700;color:#0F2044;margin-bottom:1rem}
  .field{margin-bottom:10px}
  .field label{font-size:12px;font-weight:600;color:#374151;display:block;margin-bottom:3px}
  .field input,.field select{width:100%;padding:8px 11px;border:1px solid #E2E8F0;border-radius:7px;font-size:13px}
  .modal-btns{display:flex;gap:8px;margin-top:1rem}
  .msg{padding:8px 12px;border-radius:7px;font-size:13px;margin-bottom:8px;display:none}
  .msg-ok{background:#F0FDF4;border:1px solid #86EFAC;color:#16A34A}
  .msg-err{background:#FEF2F2;border:1px solid #FCA5A5;color:#DC2626}
</style>
</head>
<body>
<div class="topbar">
  <div><h1>Payroll System</h1><span>Employee Management</span></div>
  <div style="display:flex;gap:10px;align-items:center">
    <span>{{ user.username }} ({{ user.role }})</span>
    <a href="/payroll" style="color:#fff;text-decoration:none;font-size:13px;padding:5px 12px;border:1px solid rgba(255,255,255,.3);border-radius:6px">Payroll</a>
    <a href="/logout" class="logout">Logout</a>
  </div>
</div>

<div class="main">
  <div id="msg" class="msg"></div>
  <div class="toolbar">
    <input type="text" id="search" placeholder="Search employees..." oninput="loadEmployees()" />
    <select id="statusFilter" onchange="loadEmployees()">
      <option value="">All Status</option>
      <option value="active">Active</option>
      <option value="inactive">Inactive</option>
    </select>
    <button class="btn btn-blue" onclick="openModal()">+ Add Employee</button>
  </div>
  <div class="card">
    <table id="empTable">
      <thead><tr>
        <th>Name</th><th>Email</th><th>Position</th>
        <th>Base Salary</th><th>Bonus</th><th>Status</th><th>Actions</th>
      </tr></thead>
      <tbody id="empBody"></tbody>
    </table>
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h2 id="modalTitle">Add Employee</h2>
    <input type="hidden" id="empId" />
    <div class="field"><label>Full Name</label><input id="fName" placeholder="Full name" /></div>
    <div class="field"><label>Email</label><input id="fEmail" placeholder="Email" /></div>
    <div class="field"><label>Position</label><input id="fPosition" placeholder="Position" /></div>
    <div class="field"><label>Base Salary</label><input id="fSalary" type="number" placeholder="0.00" /></div>
    <div class="field"><label>Bonus</label><input id="fBonus" type="number" placeholder="0.00" value="0" /></div>
    <div class="field"><label>Status</label>
      <select id="fStatus"><option value="active">Active</option><option value="inactive">Inactive</option></select>
    </div>
    <div class="modal-btns">
      <button class="btn btn-blue" onclick="saveEmployee()" style="flex:1">Save</button>
      <button class="btn" style="background:#E2E8F0;flex:1" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script>
window.onload = loadEmployees;

async function loadEmployees() {
  const search = document.getElementById('search').value;
  const status = document.getElementById('statusFilter').value;
  const res = await fetch(`/api/employees?search=${search}&status=${status}`);
  const emps = await res.json();
  const tbody = document.getElementById('empBody');
  if (!emps.length) { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#94A3B8;padding:1rem">No employees found</td></tr>'; return; }
  tbody.innerHTML = emps.map(e => `
    <tr>
      <td><b>${e.name}</b></td>
      <td>${e.email}</td>
      <td>${e.position}</td>
      <td>$${e.base_salary.toFixed(2)}</td>
      <td>$${e.bonus.toFixed(2)}</td>
      <td><span class="badge badge-${e.status}">${e.status}</span></td>
      <td>
        <button class="btn btn-yellow" onclick="editEmployee(${e.id})">Edit</button>
        <button class="btn btn-red" onclick="deleteEmployee(${e.id})">Delete</button>
      </td>
    </tr>
  `).join('');
}

function openModal(data=null) {
  document.getElementById('modal').classList.add('show');
  document.getElementById('modalTitle').textContent = data ? 'Edit Employee' : 'Add Employee';
  document.getElementById('empId').value = data ? data.id : '';
  document.getElementById('fName').value = data ? data.name : '';
  document.getElementById('fEmail').value = data ? data.email : '';
  document.getElementById('fPosition').value = data ? data.position : '';
  document.getElementById('fSalary').value = data ? data.base_salary : '';
  document.getElementById('fBonus').value = data ? data.bonus : 0;
  document.getElementById('fStatus').value = data ? data.status : 'active';
}

function closeModal() { document.getElementById('modal').classList.remove('show'); }

async function editEmployee(id) {
  const res = await fetch(`/api/employees/${id}`);
  const data = await res.json();
  openModal(data);
}

async function saveEmployee() {
  const id = document.getElementById('empId').value;
  const body = {
    name:        document.getElementById('fName').value,
    email:       document.getElementById('fEmail').value,
    position:    document.getElementById('fPosition').value,
    base_salary: document.getElementById('fSalary').value,
    bonus:       document.getElementById('fBonus').value,
    status:      document.getElementById('fStatus').value
  };
  const method = id ? 'PUT' : 'POST';
  const url    = id ? `/api/employees/${id}` : '/api/employees';
  const res = await fetch(url, {method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  if (res.ok) { closeModal(); showMsg('Saved successfully', 'ok'); loadEmployees(); }
  else { const d=await res.json(); showMsg(d.error||'Error saving', 'err'); }
}

async function deleteEmployee(id) {
  if (!confirm('Delete this employee and all their payroll records?')) return;
  await fetch(`/api/employees/${id}`, {method:'DELETE'});
  showMsg('Employee deleted', 'ok');
  loadEmployees();
}

function showMsg(msg, type) {
  const el = document.getElementById('msg');
  el.textContent = msg;
  el.className = `msg msg-${type}`;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 2500);
}
</script>
</body>
</html>
