<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employees — Payroll System</title>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:sans-serif;background:#F8F9FA;color:#1A1A1A}
  .topbar{background:#0F2044;color:#fff;padding:10px 1rem;display:flex;justify-content:space-between;align-items:center}
  .topbar h1{font-size:16px;font-weight:700}
  .nav-links{display:flex;gap:8px;align-items:center}
  .nav-links a{color:#fff;text-decoration:none;font-size:13px;padding:5px 12px;border:1px solid rgba(255,255,255,.3);border-radius:6px}
  .main{max-width:960px;margin:1rem auto;padding:0 1rem}
  .toolbar{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
  select{padding:8px 12px;border:1px solid #E2E8F0;border-radius:7px;font-size:13px}
  .btn{padding:8px 14px;border:none;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer}
  .btn-blue{background:#1A56A0;color:#fff}
  .btn-yellow{background:#D97706;color:#fff;padding:4px 10px;font-size:12px}
  .btn-red{background:#DC2626;color:#fff;padding:4px 10px;font-size:12px}
  .card{background:#fff;border:1px solid #E2E8F0;border-radius:10px;padding:1rem}
  table{width:100%!important}
  .badge{font-size:11px;padding:2px 8px;border-radius:9px;font-weight:600}
  .badge-active{background:#F0FDF4;color:#16A34A;border:1px solid #86EFAC}
  .badge-inactive{background:#FEF2F2;color:#DC2626;border:1px solid #FCA5A5}
  .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center}
  .modal.show{display:flex}
  .modal-box{background:#fff;border-radius:12px;padding:1.5rem;width:100%;max-width:440px;max-height:90vh;overflow-y:auto}
  .modal-box h2{font-size:17px;font-weight:700;color:#0F2044;margin-bottom:1rem}
  .field{margin-bottom:10px}
  .field label{font-size:12px;font-weight:600;color:#374151;display:block;margin-bottom:3px}
  .field input,.field select{width:100%;padding:8px 11px;border:1px solid #E2E8F0;border-radius:7px;font-size:13px;outline:none;transition:border-color .15s}
  .field input:focus{border-color:#1A56A0}
  .field input.err-input{border-color:#DC2626}
  .modal-btns{display:flex;gap:8px;margin-top:1rem}
  .msg{padding:8px 12px;border-radius:7px;font-size:13px;margin-bottom:8px;display:none}
  .msg-ok{background:#F0FDF4;border:1px solid #86EFAC;color:#16A34A}
  .msg-err{background:#FEF2F2;border:1px solid #FCA5A5;color:#DC2626}
</style>
</head>
<body>
<div class="topbar">
  <div><h1>Payroll System</h1><span style="font-size:13px;opacity:.7">Employees</span></div>
  <div class="nav-links">
    <span style="font-size:13px">{{ user.username }} ({{ user.role }})</span>
    <a href="/payroll">Payroll</a>
    {% if user.role == 'admin' %}<a href="/users-page">Users</a>{% endif %}
    <a href="/logout">Logout</a>
  </div>
</div>

<div class="main">
  <div id="msg" class="msg"></div>
  <div class="toolbar">
    <select id="statusFilter" onchange="loadEmployees()">
      <option value="">All Status</option>
      <option value="active">Active</option>
      <option value="inactive">Inactive</option>
    </select>
    <button class="btn btn-blue" onclick="openModal()">+ Add Employee</button>
  </div>
  <div class="card">
    <table id="empTable">
      <thead><tr>
        <th>Name</th><th>Email</th><th>Position</th>
        <th>Base Salary</th><th>Bonus</th><th>Status</th><th>Actions</th>
      </tr></thead>
      <tbody id="empBody"></tbody>
    </table>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h2 id="modalTitle">Add Employee</h2>
    <input type="hidden" id="empId" />
    <div class="field">
      <label>Full Name *</label>
      <input id="fName" placeholder="Enter full name" />
    </div>
    <div class="field">
      <label>Email *</label>
      <input id="fEmail" type="email" placeholder="Enter email address" />
    </div>
    <div class="field">
      <label>Position *</label>
      <input id="fPosition" placeholder="Enter job position" />
    </div>
    <div class="field">
      <label>Base Salary *</label>
      <input id="fSalary" type="number" min="0" step="0.01" placeholder="0.00" />
    </div>
    <div class="field">
      <label>Bonus</label>
      <input id="fBonus" type="number" min="0" step="0.01" value="0" placeholder="0.00" />
    </div>
    <div class="field">
      <label>Status</label>
      <select id="fStatus">
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
    </div>
    <div class="modal-btns">
      <button class="btn btn-blue" onclick="saveEmployee()" style="flex:1">Save</button>
      <button class="btn" style="background:#E2E8F0;flex:1" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script>
let empTable;
window.onload = loadEmployees;

async function loadEmployees(){
  const status = document.getElementById('statusFilter').value;
  const res    = await fetch(`/api/employees?status=${status}`);
  const emps   = await res.json();
  if(empTable) empTable.destroy();
  document.getElementById('empBody').innerHTML = emps.map(e => `
    <tr>
      <td><b>${e.name}</b></td>
      <td>${e.email}</td>
      <td>${e.position}</td>
      <td>$${e.base_salary.toFixed(2)}</td>
      <td>$${e.bonus.toFixed(2)}</td>
      <td><span class="badge badge-${e.status}">${e.status}</span></td>
      <td>
        <button class="btn btn-yellow" onclick="editEmployee(${e.id})">Edit</button>
        <button class="btn btn-red" onclick="deleteEmployee(${e.id})">Delete</button>
      </td>
    </tr>
  `).join('');
  empTable = $('#empTable').DataTable({ pageLength:10, columnDefs:[{orderable:false,targets:6}] });
}

function clearInputErrors(){
  ['fName','fEmail','fPosition','fSalary','fBonus'].forEach(id => {
    document.getElementById(id).classList.remove('err-input');
  });
}

function markError(fieldId, msg){
  document.getElementById(fieldId).classList.add('err-input');
  document.getElementById(fieldId).focus();
  showMsg(msg, 'err');
}

function openModal(data=null){
  document.getElementById('modal').classList.add('show');
  document.getElementById('modalTitle').textContent = data ? 'Edit Employee' : 'Add Employee';
  document.getElementById('empId').value     = data?.id       || '';
  document.getElementById('fName').value     = data?.name     || '';
  document.getElementById('fEmail').value    = data?.email    || '';
  document.getElementById('fPosition').value = data?.position || '';
  document.getElementById('fSalary').value   = data?.base_salary !== undefined ? data.base_salary : '';
  document.getElementById('fBonus').value    = data?.bonus    !== undefined ? data.bonus : 0;
  document.getElementById('fStatus').value   = data?.status   || 'active';
  clearInputErrors();
  document.getElementById('msg').style.display = 'none';
}

function closeModal(){
  document.getElementById('modal').classList.remove('show');
  clearInputErrors();
}

async function editEmployee(id){
  const res = await fetch(`/api/employees/${id}`);
  openModal(await res.json());
}

async function saveEmployee(){
  clearInputErrors();

  const id       = document.getElementById('empId').value;
  const name     = document.getElementById('fName').value.trim();
  const email    = document.getElementById('fEmail').value.trim();
  const position = document.getElementById('fPosition').value.trim();
  const salary   = document.getElementById('fSalary').value.trim();
  const bonus    = document.getElementById('fBonus').value.trim();
  const status   = document.getElementById('fStatus').value;

  // Validate one by one — stop at first error
  if(!name){
    markError('fName', 'Name is required'); return;
  }
  if(name.length > 100){
    markError('fName', 'Name is too long (max 100 characters)'); return;
  }
  if(!email){
    markError('fEmail', 'Email is required'); return;
  }
  if(!email.includes('@') || !email.includes('.')){
    markError('fEmail', 'Enter a valid email address'); return;
  }
  if(email.length > 150){
    markError('fEmail', 'Email is too long'); return;
  }
  if(!position){
    markError('fPosition', 'Position is required'); return;
  }
  if(position.length > 100){
    markError('fPosition', 'Position is too long (max 100 characters)'); return;
  }
  if(salary === ''){
    markError('fSalary', 'Base salary is required'); return;
  }
  if(isNaN(parseFloat(salary))){
    markError('fSalary', 'Base salary must be a number'); return;
  }
  if(parseFloat(salary) < 0){
    markError('fSalary', 'Base salary cannot be negative'); return;
  }
  if(bonus !== '' && isNaN(parseFloat(bonus))){
    markError('fBonus', 'Bonus must be a number'); return;
  }
  if(bonus !== '' && parseFloat(bonus) < 0){
    markError('fBonus', 'Bonus cannot be negative'); return;
  }

  const body = {
    name:        name,
    email:       email,
    position:    position,
    base_salary: parseFloat(salary),
    bonus:       bonus === '' ? 0 : parseFloat(bonus),
    status:      status
  };

  const res = await fetch(id ? `/api/employees/${id}` : '/api/employees', {
    method:  id ? 'PUT' : 'POST',
    headers: {'Content-Type':'application/json'},
    body:    JSON.stringify(body)
  });

  if(res.ok){
    closeModal();
    showMsg('Employee saved successfully', 'ok');
    loadEmployees();
  } else {
    const d = await res.json();
    showMsg(d.error || 'Error saving employee', 'err');
  }
}

async function deleteEmployee(id){
  if(!confirm('Delete this employee and all their payroll records?')) return;
  const res = await fetch(`/api/employees/${id}`, {method:'DELETE'});
  if(res.ok){ showMsg('Employee deleted', 'ok'); loadEmployees(); }
  else { const d = await res.json(); showMsg(d.error||'Error deleting','err'); }
}

function showMsg(msg, type){
  const el = document.getElementById('msg');
  el.textContent   = msg;
  el.className     = `msg msg-${type}`;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 3000);
}
</script>
</body>
</html>
